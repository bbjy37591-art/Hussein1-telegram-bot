  <script>
    const GAS_URL_FALLBACK = "https://script.google.com/macros/s/AKfycbwNegaEse1q9IyG6TcvpoLiZOUWEqSd-5zwwadQcdhGlj_xBryYbTWAQfth7KQ1m1Fm/exec";
    const ADMIN_UN_LOCK = "tessla2";

    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const QS = new URLSearchParams(location.search);
    const API_KEY = "ee_uob_api_v18", AUTH_KEY = "ee_uob_auth_v18", CACHE_KEY = "ee_uob_state_v18";
    let GAS_URL = QS.get("api") || "";
    try {
      if (GAS_URL.includes("/exec")) localStorage.setItem(API_KEY, GAS_URL);
      else GAS_URL = localStorage.getItem(API_KEY) || GAS_URL_FALLBACK;
    } catch (e) { if (!GAS_URL) GAS_URL = GAS_URL_FALLBACK; }

    const INIT_TAB = QS.get("tab") || "";

    const DEFAULT_EMBLEM_SVG =
      '<svg viewBox="0 0 240 240" width="112" height="112" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="gMain" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff8db"/><stop offset="35%" stop-color="#f9de7e"/><stop offset="70%" stop-color="#c99a26"/><stop offset="100%" stop-color="#785009"/></linearGradient>' +
      '<linearGradient id="gLetter" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fff9e3"/><stop offset="45%" stop-color="#f7da73"/><stop offset="100%" stop-color="#9e7114"/></linearGradient>' +
      '<radialGradient id="gBg" cx="50%" cy="42%" r="58%"><stop offset="0%" stop-color="#21190b"/><stop offset="100%" stop-color="#050507"/></radialGradient>' +

      '<circle cx="120" cy="120" r="103" fill="none" stroke="url(#gMain)" stroke-width="5.5" stroke-dasharray="10 6"/>' +
      '<circle cx="120" cy="120" r="91" fill="none" stroke="url(#gMain)" stroke-width="1.8"/>' +

      '<text fill="url(#gMain)" font-family="Georgia,serif" font-size="10.5" font-weight="800" letter-spacing="0.4"><textPath href="#botArc" startOffset="50%" text-anchor="middle">Department of Electrical Engineering</textPath></text>' +
      '<text x="41" y="124" fill="#fae596" font-family="Georgia,serif" font-size="9.5" font-weight="900" text-anchor="middle">1950</text>' +
      '<text x="199" y="124" fill="#fae596" font-family="Georgia,serif" font-size="9.5" font-weight="900" text-anchor="middle">1950</text>' +
      '<text x="120" y="151" fill="url(#gLetter)" stroke="#4d3204" stroke-width="1.6" font-family="Georgia,serif" font-size="88" font-weight="900" text-anchor="middle">E</text></svg>';

    const COLOR_OPTIONS = [
      { id: "phantom", label: "🖤 أسود ملكي فانتوم" }, { id: "gold", label: "✨ ذهبي معدني ملكي" },
      { id: "ruby", label: "♦️ ياقوتي عميق" }, { id: "emerald", label: "💚 زمردي فاخر" },
      { id: "azure", label: "💙 لازوردي ملكي" }, { id: "imperial", label: "💜 بنفسجي إمبراطوري" },
      { id: "fiery", label: "🔥 برونزي متوهج" }, { id: "silver", label: "🩶 تيتانيوم فضي" }
    ];

    function initPcbCanvas() {
      const canvas = document.getElementById("pcbCanvas"), hero = document.getElementById("heroBox");
      if (!canvas || !hero) return;
      const ctx = canvas.getContext("2d");
      let W = 0, H = 0, dpr = 1, traces = [], chips = [], pulses = [];

      const rawLeft = [
        [[0.00, 0.14], [0.13, 0.14], [0.20, 0.25], [0.34, 0.25]],
        [[0.00, 0.20], [0.11, 0.20], [0.18, 0.31], [0.33, 0.31]],
        [[0.00, 0.33], [0.09, 0.33], [0.14, 0.41], [0.24, 0.41], [0.28, 0.36], [0.35, 0.36]],
        [[0.00, 0.46], [0.15, 0.46], [0.21, 0.37], [0.31, 0.37]],
        [[0.00, 0.56], [0.12, 0.56], [0.19, 0.45], [0.33, 0.45]],
        [[0.00, 0.67], [0.10, 0.67], [0.18, 0.54], [0.27, 0.54], [0.31, 0.49], [0.36, 0.49]],
        [[0.00, 0.80], [0.16, 0.80], [0.24, 0.67], [0.34, 0.67]],
        [[0.06, 1.00], [0.06, 0.88], [0.15, 0.74], [0.23, 0.74]],
        [[0.22, 0.00], [0.22, 0.12], [0.29, 0.22], [0.36, 0.22]]
      ];

      function build() {
        const r = hero.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.max(280, Math.round(r.width)); H = Math.max(190, Math.round(r.height));
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        traces = [];
        const add = (np, mir) => {
          const pts = np.map(p => ({ x: (mir ? 1 - p[0] : p[0]) * W, y: p[1] * H }));
          const segs = []; let total = 0;
          for (let i = 0; i < pts.length - 1; i++) {
            const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
            segs.push({ x1: pts[i].x, y1: pts[i].y, x2: pts[i + 1].x, y2: pts[i + 1].y, len, start: total });
            total += len;
          }
          traces.push({ pts, segs, total, end: pts[pts.length - 1] });
        };
        rawLeft.forEach(p => { add(p, false); add(p, true); });
        chips = [
          { x: W * 0.075, y: H * 0.44, w: 16, h: 11 }, { x: W * 0.925 - 16, y: H * 0.44, w: 16, h: 11 },
          { x: W * 0.12, y: H * 0.78, w: 13, h: 9 }, { x: W * 0.88 - 13, y: H * 0.78, w: 13, h: 9 }
        ];
        pulses = traces.map((tr, i) => ({ idx: i, dist: (i * 47) % Math.max(1, tr.total), speed: 38 + (i % 4) * 11, dir: i % 3 === 1 ? -1 : 1, tail: 26 + (i % 3) * 10 }));
      }

      function ptAt(tr, d) {
        if (d <= 0) return tr.pts[0];
        if (d >= tr.total) return tr.end;
        for (const s of tr.segs) {
          if (d <= s.start + s.len) { const t = s.len ? (d - s.start) / s.len : 0; return { x: s.x1 + (s.x2 - s.x1) * t, y: s.y1 + (s.y2 - s.y1) * t }; }
        }
        return tr.end;
      }

      let lastTs = 0;
      function frame(ts) {
        requestAnimationFrame(frame);
        if (document.hidden || !W || !H) { lastTs = ts; return; }
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016; lastTs = ts;
        ctx.clearRect(0, 0, W, H);

        ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 1.25; ctx.strokeStyle = "rgba(212, 175, 55, 0.22)";
        for (const tr of traces) { ctx.beginPath(); ctx.moveTo(tr.pts[0].x, tr.pts[0].y); for (let j = 1; j < tr.pts.length; j++) ctx.lineTo(tr.pts[j].x, tr.pts[j].y); ctx.stroke(); }

        ctx.fillStyle = "rgba(10, 9, 7, 0.9)"; ctx.strokeStyle = "rgba(212, 175, 55, 0.42)"; ctx.lineWidth = 1;
        for (const ch of chips) { ctx.fillRect(ch.x, ch.y, ch.w, ch.h); ctx.strokeRect(ch.x, ch.y, ch.w, ch.h); }

        for (const pl of pulses) {
          const tr = traces[pl.idx];
          pl.dist += pl.speed * dt * pl.dir;
          if (pl.dir > 0 && pl.dist > tr.total + pl.tail) pl.dist = -12;
          if (pl.dir < 0 && pl.dist < -pl.tail) pl.dist = tr.total + 12;

          for (let s = 0; s < 9; s++) {
            const dA = pl.dist - s * (pl.tail / 9) * pl.dir, dB = pl.dist - (s + 1) * (pl.tail / 9) * pl.dir;
            if ((dA < 0 && dB < 0) || (dA > tr.total && dB > tr.total)) continue;
            const pA = ptAt(tr, Math.max(0, Math.min(tr.total, dA))), pB = ptAt(tr, Math.max(0, Math.min(tr.total, dB))), a = 1 - s / 9;
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y);
            ctx.strokeStyle = "rgba(255, 240, 178, " + (a * 0.82).toFixed(3) + ")"; ctx.lineWidth = 1.1 + a * 1.4; ctx.stroke();
          }
          if (pl.dist >= 0 && pl.dist <= tr.total) {
            const hd = ptAt(tr, pl.dist), g = ctx.createRadialGradient(hd.x, hd.y, 0.5, hd.x, hd.y, 6);
            g.addColorStop(0, "rgba(255, 250, 224, 0.95)"); g.addColorStop(0.45, "rgba(248, 220, 120, 0.42)"); g.addColorStop(1, "rgba(212, 175, 55, 0)");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hd.x, hd.y, 6, 0, Math.PI * 2); ctx.fill();
          }
        }

        const pa = 0.45 + 0.4 * Math.sin(ts * 0.0026);
        for (let v = 0; v < traces.length; v++) {
          const ep = traces[v].end;
          ctx.beginPath(); ctx.arc(ep.x, ep.y, 3.1, 0, Math.PI * 2); ctx.fillStyle = "#090806"; ctx.fill(); ctx.lineWidth = 1.25; ctx.strokeStyle = "rgba(212, 175, 55, 0.58)"; ctx.stroke();
          ctx.beginPath(); ctx.arc(ep.x, ep.y, 1.35, 0, Math.PI * 2); ctx.fillStyle = "rgba(255, 244, 198, " + (v % 2 === 0 ? pa : 1.1 - pa).toFixed(2) + ")"; ctx.fill();
        }
      }
      build(); window.addEventListener("resize", build); requestAnimationFrame(frame);
    }

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#040406"); tg.setBackgroundColor("#040406"); } catch (e) {} }

    const INIT_DATA = tg && tg.initData ? tg.initData : "";
    const tgU = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    const CLIENT_UN = tgU && tgU.username ? String(tgU.username).replace(/^@/, "").toLowerCase() : "";

    let UID = QS.get("uid") || (tgU && tgU.id ? String(tgU.id) : "0");
    let ASIG = QS.get("asig") || "", USIG = QS.get("usig") || "";
    let NAME = QS.get("name") || (tgU ? [tgU.first_name, tgU.last_name].filter(Boolean).join(" ") : "");

    try {
      if (UID && UID !== "0" && (USIG || ASIG)) localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: UID, usig: USIG, asig: ASIG, name: NAME }));
      else {
        const sA = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
        if (sA && sA.uid) { UID = String(sA.uid); USIG = sA.usig || ""; ASIG = sA.asig || ""; if (!NAME && sA.name) NAME = sA.name; }
      }
    } catch (e) {}
    if (CLIENT_UN && CLIENT_UN !== ADMIN_UN_LOCK) ASIG = "";

    let STATE = { ok: true, isAdmin: false, logo: "", banners: [], nodes: { root: { id: "root", label: "الرَّئِيسِيَّةُ", rows: [], items: [] } } };
    try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (c && c.nodes) STATE = Object.assign(STATE, c); } catch (e) {}

    let CUR_MODE = "main", CUR_NODE = "root", ADM_NODE = "root", DASH_DATA = null, USER_FILTER = "all";
    let SUP_POLL_TIMER = null, SUP_USER_REV = -1, SUP_USER_MSGS = [];
    let SUP_ADM_LIST = [], SUP_ADM_FILTER = "chats", SUP_ADM_SEARCH = "", SUP_ADM_ACTIVE_UID = "", SUP_ADM_ACTIVE_USER = null, SUP_ADM_REV = -1, SUP_ADM_MSGS = [];
    let STAGED_FILE = null, ACTIVE_BLOB_URL = "";

    const ex = s => String(s || "").replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
    const linkify = s => ex(s).replace(/https?:\/\/[^\s<]+/g, m => '<a href="' + m + '" target="_blank">' + m + '</a>');
    const haptic = () => { try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
    function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove("show"), 2700); }
    function openModal(title, html) { document.getElementById("modalTitle").textContent = title; document.getElementById("modalBody").innerHTML = html; document.getElementById("modalBg").classList.add("show"); }
    function closeModal() { document.getElementById("modalBg").classList.remove("show"); }
    function showBannedView() { stopSupportPoll(); document.getElementById("appShell").style.display = "none"; document.getElementById("bannedScreen").classList.add("show"); }

    function callServer(payload) {
      if (!GAS_URL || !GAS_URL.startsWith("http")) return Promise.reject(new Error("Missing GAS_URL"));
      const full = Object.assign({ initData: INIT_DATA, uid: UID, asig: ASIG, usig: USIG, clientUn: CLIENT_UN, name: NAME }, payload);
      return fetch(GAS_URL, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(full) }).then(r => r.json());
    }

    const miniLogoHtml = () => STATE.logo ? '<img src="' + STATE.logo + '" alt="" />' : DEFAULT_EMBLEM_SVG.replace('width="112" height="112"', 'width="40" height="40"');
    const applyLogo = () => { document.getElementById("emblemWrap").innerHTML = STATE.logo ? '<img src="' + STATE.logo + '" alt="" />' : DEFAULT_EMBLEM_SVG; };
    function updateUnreadBadge(n) { const b = document.getElementById("supBadge"), num = Number(n || 0); b.textContent = num > 99 ? "99+" : String(num); b.classList.toggle("show", num > 0); }

    function renderBanners() {
      const wrap = document.getElementById("bannersWrap"), imgs = (STATE.banners || []).filter(Boolean);
      if (!imgs.length || CUR_NODE !== "root") { wrap.style.display = "none"; return; }
      wrap.className = "banners" + (imgs.length === 1 ? " single" : "");
      wrap.innerHTML = imgs.map(src => '<img src="' + src + '" alt="" />').join(""); wrap.style.display = "grid";
    }

    function buildBreadcrumb(id) {
      const parts = []; let cur = STATE.nodes[id], g = 0;
      while (cur && cur.id !== "root" && g++ < 15) { parts.unshift(cur.label); cur = STATE.nodes[cur.parent]; }
      return "🏠 الرَّئِيسِيَّةُ ◂ " + parts.join(" ◂ ");
    }

    function openNode(id, logClick) {

    function b64ToBytes(b64) { const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return arr; }

    function renderPdfCanvas(b64, bodyEl) {
      if (!window.pdfjsLib) { bodyEl.innerHTML = '<div class="empty">اضغط زر التحميل لإرسال ملف PDF إلى محادثتك.</div>'; return; }
      bodyEl.innerHTML = '<div class="empty">⏳ جاري تجهيز صفحات PDF للقراءة...</div>';
      pdfjsLib.getDocument({ data: b64ToBytes(b64) }).promise.then(pdf => {
        bodyEl.innerHTML = ""; let pIdx = 1;
        const next = () => {
          if (pIdx > pdf.numPages) return;
          pdf.getPage(pIdx++).then(page => {
            const vp = page.getViewport({ scale: 1.5 }), c = document.createElement("canvas");
            c.width = vp.width; c.height = vp.height; bodyEl.appendChild(c);
            page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise.then(next);
          });
        };
        next();
      }).catch(() => { bodyEl.innerHTML = '<div class="empty">تعذّر العرض المباشر، اضغط زر التحميل لإرسال الملف للمحادثة.</div>'; });
    }

    function showPreviewResult(r, bodyEl) {
      if (r && r.banned) return showBannedView();
      if (!r || !r.ok) { bodyEl.innerHTML = '<div class="empty">' + ex((r && r.error) || "اضغط زر التحميل بالأسفل.") + '</div>'; return; }
      if (r.mode === "image") bodyEl.innerHTML = '<img src="' + r.dataUrl + '" alt="" />';
      else if (r.mode === "pdf_b64") renderPdfCanvas(r.b64, bodyEl);
      else if (r.mode === "text") bodyEl.innerHTML = '<pre class="viewer-pre">' + ex(r.textContent) + '</pre>';
      else if (r.mode === "video_b64" || r.mode === "audio_b64") {
        ACTIVE_BLOB_URL = URL.createObjectURL(new Blob([b64ToBytes(r.b64)], { type: r.mime || "application/octet-stream" }));
        bodyEl.innerHTML = r.mode === "video_b64" ? '<video controls playsinline src="' + ACTIVE_BLOB_URL + '"></video>' : '<audio controls src="' + ACTIVE_BLOB_URL + '" style="width:94%;margin:auto"></audio>';
      } else if (r.mode === "drive" && r.driveUrl) bodyEl.innerHTML = '<iframe src="' + r.driveUrl + '" allow="autoplay"></iframe>';
      else bodyEl.innerHTML = '<div class="empty">اضغط زر التحميل لإرسال الملف إلى محادثتك.</div>';
    }

    function scrollChatBottom() { const box = document.getElementById("chatMsgsBox"); if (box) box.scrollTop = box.scrollHeight + 300; }
    const readFileBase64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    function compressImage(file, maxW, q) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => { const sc = Math.min(1, maxW / img.width), c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", q)); };
        img.onerror = rej; img.src = URL.createObjectURL(file);
      });
    }

    function clearStagedFile() { STAGED_FILE = null; const b = document.getElementById("attachBar"), i = document.getElementById("chatFileInp"); if (b) { b.classList.remove("show"); b.innerHTML = ""; } if (i) i.value = ""; }
    function bindChatFilePicker() {
      const inp = document.getElementById("chatFileInp"); if (!inp) return;
      inp.onchange = () => {
        if (!inp.files || !inp.files[0]) return;
        const file = inp.files[0]; if (file.size > 15 * 1024 * 1024) { toast("⚠️ الحد الأقصى 15MB"); inp.value = ""; return; }
        const isImg = String(file.type || "").startsWith("image/");
        const sz = file.size > 1048576 ? (file.size / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(file.size / 1024)) + " KB";
        STAGED_FILE = { file, isImage: isImg, thumb: "" };
        const bar = document.getElementById("attachBar");
        if (bar) { bar.innerHTML = '<span>' + (isImg ? "🖼️ " : "📎 ") + ex(file.name) + ' (' + sz + ')</span><button class="mbtn del" style="padding:2px 8px" data-act="clr_attach">✖</button>'; bar.classList.add("show"); }
        if (isImg) compressImage(file, 320, 0.58).then(th => { if (STAGED_FILE && STAGED_FILE.file === file) STAGED_FILE.thumb = th; }).catch(() => {});
      };
    }

      if (!m.media) return "";

    function prepareStagedMedia(staged) {
      if (!staged || !staged.file) return Promise.resolve(null);
      const f = staged.file;
      if (staged.isImage) return Promise.all([compressImage(f, 1280, 0.82), staged.thumb ? Promise.resolve(staged.thumb) : compressImage(f, 320, 0.58)]).then(r => ({ fileName: f.name, mimeType: "image/jpeg", base64: r[0], thumb: r[1] }));
      return readFileBase64(f).then(b64 => ({ fileName: f.name, mimeType: f.type || "application/octet-stream", base64: b64, thumb: "" }));

      if (act === "pick_attach") { const fi = document.getElementById("chatFileInp"); if (fi) fi.click(); return; }
      if (act === "clr_attach") return clearStagedFile();
      if (act === "sup_u_send") return sendUserSupportMsg();
      if (act === "sup_a_flt") { SUP_ADM_FILTER = val; return renderAdminSupportInbox(); }
      if (act === "sup_a_open") return openAdminChatRoom(id);
      if (act === "sup_a_back") return loadAdminSupportInbox();
      if (act === "sup_a_send") return sendAdminSupportMsg();
      if (act === "sup_view_media") return openChatMediaViewer(id, el.getAttribute("data-fn") || "مرفق", val);
      if (act === "sup_dl_media") return downloadChatMedia(id, val, el);
      if (act === "sup_a_prof") { if (SUP_ADM_ACTIVE_USER) openUserProfile(SUP_ADM_ACTIVE_USER.un || "", SUP_ADM_ACTIVE_USER.id); return; }
      if (act === "sup_a_clear_menu") return openModal("🗑️ خيارات حذف المحادثة", '<button class="btn" data-act="sup_a_clear_u">🧹 حذف من عند المستخدم فقط (تبقى محفوظة عندك)</button><button class="btn btn-danger" data-act="sup_a_wipe">🗑️ حذف نهائي من الطرفين</button><button class="btn-out" data-act="close_modal">إلغاء</button>');
      if (act === "sup_a_hid") return callServer({ app_action: "sup_adm_hide_msg", targetUid: SUP_ADM_ACTIVE_UID, msgId: id }).then(r => { if (r && r.ok) { SUP_ADM_REV = r.rev; SUP_ADM_MSGS = r.msgs; renderAdminChatBubbles(false); toast("👁️‍🗨️ تم الإخفاء عن المستخدم"); } }).catch(() => {});
      if (act === "sup_a_del") return callServer({ app_action: "sup_adm_del_msg", targetUid: SUP_ADM_ACTIVE_UID, msgId: id }).then(r => { if (r && r.ok) { SUP_ADM_REV = r.rev; SUP_ADM_MSGS = r.msgs; renderAdminChatBubbles(false); toast("🗑️ تم الحذف نهائياً"); } }).catch(() => {});
      if (act === "sup_a_clear_u") { closeModal(); return callServer({ app_action: "sup_adm_clear_user", targetUid: SUP_ADM_ACTIVE_UID }).then(r => { if (r && r.ok) { SUP_ADM_REV = r.rev; SUP_ADM_MSGS = r.msgs; renderAdminChatBubbles(false); toast("🧹 مُسحت من عند المستخدم وبقيت محفوظة عندك"); } }).catch(() => {}); }
      if (act === "sup_a_wipe") { closeModal(); return callServer({ app_action: "sup_adm_wipe_all", targetUid: SUP_ADM_ACTIVE_UID }).then(r => { if (r && r.ok) { SUP_ADM_REV = r.rev; SUP_ADM_MSGS = []; renderAdminChatBubbles(false); toast("🗑️ تم الحذف من الطرفين"); } }).catch(() => {}); }
      if (act === "adm_msg_user") { switchMode("support"); return openAdminChatRoom(id); }

      if (act === "adm_go") { ADM_NODE = id; return renderAdminButtons(); }
      if (act === "adm_edit") {
        const b = STATE.nodes[id]; if (!b) return;
        const opts = COLOR_OPTIONS.map(c => '<option value="' + c.id + '"' + (b.color === c.id ? " selected" : "") + '>' + c.label + '</option>').join("");
        return openModal("✏️ تعديل الزر واللون", '<input id="edLbl" class="inp" value="' + ex(b.label) + '" /><textarea id="edDesc">' + ex(b.desc || "") + '</textarea><select id="edCol">' + opts + '</select><div class="modal-actions"><button class="btn" style="margin:0" data-act="save_edit" data-id="' + ex(id) + '">💾 حفظ</button><button class="btn-out" style="margin:0;width:auto;padding:0 16px" data-act="close_modal">إلغاء</button></div>');
      }
      if (act === "adm_del") {
        const b = STATE.nodes[id]; if (!b) return;
        return openModal("🗑️ تأكيد الحذف", '<div style="font-family:var(--font-ui);font-size:14.5px;color:#e5dcc6;line-height:1.7">حذف <b>' + ex(b.label) + '</b> وجميع أزراره وملفاته نهائياً؟</div><div class="modal-actions"><button class="btn btn-danger" style="margin:0" data-act="confirm_del" data-id="' + ex(id) + '">🗑️ نعم، احذف</button><button class="btn-out" style="margin:0;width:auto;padding:0 16px" data-act="close_modal">إلغاء</button></div>');
      }
      if (act === "toggle_ban") {
        const doBan = val === "1"; el.disabled = true;
        return callServer({ app_action: "toggle_ban", targetUid: id, ban: doBan }).then(r => { if (r && r.ok && r.dash) { DASH_DATA = r.dash; renderDashboardView(); toast(doBan ? "🔒 تم حظر المستخدم" : "✅ تم فك الحظر"); } el.disabled = false; }).catch(() => { el.disabled = false; });
      }
      if (act === "adm_mv") return callServer({ app_action: "move_btn", btnId: id, dir: Number(val) }).then(applyState).catch(() => {});
      if (act === "adm_create") {
        const lbl = document.getElementById("newBtnName").value.trim(), dsc = document.getElementById("newBtnDesc").value.trim(), col = document.getElementById("newBtnCol").value, wm = document.getElementById("newBtnW").value;
        if (!lbl) return toast("اكتب اسم الزر أولاً"); el.disabled = true;
        return callServer({ app_action: "add_btn", parentId: ADM_NODE, label: lbl, desc: dsc, color: col, widthMode: wm }).then(r => { if (r && r.ok) { applyState(r); toast("✅ تمت الإضافة"); } else toast((r && r.error) || "⚠️ غير مصرح"); el.disabled = false; }).catch(() => { el.disabled = false; });
      }
      if (act === "save_edit") {
        const eLbl = document.getElementById("edLbl").value.trim(), eDsc = document.getElementById("edDesc").value.trim(), eCol = document.getElementById("edCol").value;
        if (!eLbl) return toast("اكتب الاسم أولاً"); el.disabled = true;
        return callServer({ app_action: "update_btn", btnId: id, label: eLbl, desc: eDsc, color: eCol }).then(r => { applyState(r); closeModal(); toast("✅ تم الحفظ"); el.disabled = false; }).catch(() => { el.disabled = false; });
      }
      if (act === "confirm_del") { el.disabled = true; return callServer({ app_action: "del_btn", btnId: id }).then(r => { applyState(r); closeModal(); toast("🗑️ تم الحذف"); el.disabled = false; }).catch(() => { el.disabled = false; }); }
      if (act === "adm_add_txt") { const txt = document.getElementById("txtCur").value.trim(); if (!txt) return toast("اكتب النص أولاً"); el.disabled = true; return callServer({ app_action: "add_text", btnId: id, text: txt }).then(r => { applyState(r); toast("✅ تم الحفظ"); el.disabled = false; }).catch(() => { el.disabled = false; }); }
      if (act === "adm_del_item") return callServer({ app_action: "del_item", btnId: id, idx }).then(r => { applyState(r); toast("🗑️ تم الحذف"); }).catch(() => {});
      if (act === "adm_up_file") {
        const inp = document.getElementById("flCur"); if (!inp || !inp.files || !inp.files[0]) return toast("اختر ملفاً أولاً");
        const file = inp.files[0]; if (file.size > 15 * 1024 * 1024) return toast("⚠️ الحد الأقصى 15MB");
        el.disabled = true; el.textContent = "⏳ رفع...";
        return readFileBase64(file).then(b64 => callServer({ app_action: "upload_item", btnId: id, fileName: file.name, mimeType: file.type || "application/octet-stream", base64: b64 }))
          .then(r => { if (r && r.ok) { applyState(r); toast("✅ تم رفع الملف"); } else toast("⚠️ " + ((r && r.error) || "فشل الرفع")); el.disabled = false; el.textContent = "📤 رفع ملف"; })
          .catch(() => { toast("⚠️ تعذّر الرفع"); el.disabled = false; el.textContent = "📤 رفع ملف"; });
      }
      if (act === "up_logo") { const li = document.getElementById("logoInp"); if (!li || !li.files[0]) return toast("اختر صورة"); el.disabled = true; el.textContent = "⏳..."; return compressImage(li.files[0], 320, 0.84).then(du => callServer({ app_action: "save_logo", dataUrl: du })).then(r => { applyState(r); toast("✅ تم التحديث"); el.disabled = false; el.textContent = "📤 حفظ الشعار"; }).catch(() => { el.disabled = false; el.textContent = "📤 حفظ الشعار"; }); }
      if (act === "clr_logo") return callServer({ app_action: "save_logo", dataUrl: "" }).then(r => { applyState(r); toast("✅ تمت الاستعادة"); }).catch(() => {});
      if (act === "up_ban") { const bi = document.getElementById("imgSlot_" + val); if (!bi || !bi.files[0]) return toast("اختر صورة"); el.disabled = true; el.textContent = "⏳..."; return compressImage(bi.files[0], 720, 0.72).then(du => callServer({ app_action: "save_banner", slot: Number(val), dataUrl: du })).then(r => { applyState(r); toast("✅ تم الحفظ"); el.disabled = false; el.textContent = "📤 حفظ الصورة " + val; }).catch(() => { el.disabled = false; el.textContent = "📤 حفظ الصورة " + val; }); }
      if (act === "clr_ban") return callServer({ app_action: "save_banner", slot: Number(val), dataUrl: "" }).then(r => { applyState(r); toast("🗑️ تم الحذف"); }).catch(() => {});
    });

    setInterval(() => {
      if (CUR_MODE === "support") return;
      callServer({ app_action: "unread_ping" }).then(r => { if (r && r.ok) updateUnreadBadge(r.unreadSupport || 0); }).catch(() => {});
    }, 15000);

    (function boot() {
      initPcbCanvas();
      applyState(STATE);
      if (INIT_TAB === "support") switchMode("support");
      callServer({ app_action: "sync_state" }).then(r => {
        if (r && r.banned) return showBannedView();
        if (r && r.ok) applyState(r);
      }).catch(() => {});
    })();
  </script>
</body>
</html>
